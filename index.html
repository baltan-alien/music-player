<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometric Piano Synthesizer</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
        }

        /* 画面全体のコンテナ */
        #app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
            position: relative;
        }

        /* 背景波紋用Canvas */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 上段：コードボタンエリア */
        .chord-section {
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            padding: 2px;
            flex-shrink: 0;
        }
        .chord-btn {
            background: linear-gradient(135deg, #ffe259, #ffa751);
            color: #111;
            border: none;
            border-radius: 10px;
            padding: 6px 2px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(255,167,81,0.3);
            text-align: center;
        }
        .chord-btn.type-maj7 { background: linear-gradient(135deg, #00c6ff, #0072ff); color: #fff; }
        .chord-btn.type-add { background: linear-gradient(135deg, #56ab2f, #a8e063); color: #111; }
        .chord-btn.type-ext { background: linear-gradient(135deg, #8A2387, #E94057, #F27121); color: #fff; }
        .chord-btn.type-gray { background: linear-gradient(135deg, #bdc3c7, #2c3e50); color: #fff; }
        
        .chord-btn:active, .chord-btn.active {
            filter: brightness(1.4);
            box-shadow: 0 0 12px #fff, 0 0 20px #ff0;
            transform: scale(0.95);
        }

        /* 中段：トランスポーズ（転調）エリア */
        .transpose-section {
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 2px 0;
            flex-shrink: 0;
        }
        .trans-btn {
            background: #444;
            color: #fff;
            border: 2px solid #666;
            width: 40px;
            height: 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .trans-btn:active {
            background: #666;
            box-shadow: 0 0 10px #fff;
        }
        .trans-display {
            background: #ffffff;
            color: #000000;
            width: 46px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
        }

        /* 下段：幾何学七角形ピアノパッドエリア */
        .piano-section {
            z-index: 2;
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 0; /* flexアイテムが縮小できるようにする重要設定 */
            overflow: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }
        #piano-canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
</head>
<body>
<div id="app-container">
    <canvas id="bg-canvas"></canvas>

    <!-- 上段：コードボタン群 -->
    <div class="chord-section" id="chord-buttons">
        <button class="chord-btn" data-chord="Maj">Maj</button>
        <button class="chord-btn" data-chord="Min">Min</button>
        <button class="chord-btn" data-chord="Dim">Dim</button>
        <button class="chord-btn" data-chord="Aug">Aug</button>
        
        <button class="chord-btn type-maj7" data-chord="Maj7">Maj7</button>
        <button class="chord-btn type-maj7" data-chord="Min7">Min7</button>
        <button class="chord-btn type-maj7" data-chord="7">7</button>
        <button class="chord-btn type-maj7" data-chord="M7b7">M7♭7</button>
        
        <button class="chord-btn type-add" data-chord="Add7">Add7</button>
        <button class="chord-btn type-add" data-chord="Add9">Add9</button>
        <button class="chord-btn type-gray" data-chord="Slash">Slash</button>
        <button class="chord-btn type-gray" data-chord="Clear">Clear</button>
        
        <button class="chord-btn type-ext" data-chord="9">9</button>
        <button class="chord-btn type-ext" data-chord="11">11</button>
        <button class="chord-btn type-ext" data-chord="13">13</button>
    </div>

    <!-- 中段：半音転調エリア -->
    <div class="transpose-section">
        <button class="trans-btn" id="btn-flat">♭</button>
        <div class="trans-display" id="trans-value">0</div>
        <button class="trans-btn" id="btn-sharp">#</button>
    </div>

    <!-- 下段：七角形放射ピアノパッドエリア -->
    <div class="piano-section">
        <canvas id="piano-canvas"></canvas>
    </div>
</div>

<script>
    // --- 音響・物理モデリングエンジン (Web Audio API) ---
    let audioCtx = null;
    let activeNotes = new Map(); 
    let activeRipples = [];     
    let activeGlows = [];       

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function getNoteFrequency(midiNote) {
        return 440 * Math.pow(2, (midiNote - 69) / 12);
    }

    function playPianoNote(midiNote, velocity = 0.8) {
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        const fundamentalFreq = getNoteFrequency(midiNote);

        const masterGain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(Math.min(fundamentalFreq * 6, 8000), now);
        filter.Q.setValueAtTime(1.5, now);

        masterGain.gain.setValueAtTime(0, now);
        masterGain.gain.linearRampToValueAtTime(0.25 * velocity, now + 0.008);
        masterGain.gain.exponentialRampToValueAtTime(0.001, now + 2.2);

        filter.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        const oscillators = [];
        const detunes = [-2.5, 0, 2.5];
        detunes.forEach((detune, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            let freq = fundamentalFreq * Math.pow(2, detune / 1200);
            
            osc.type = (idx === 1) ? 'triangle' : 'sine';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(idx === 1 ? 0.7 : 0.3, now);

            osc.connect(gain);
            gain.connect(filter);
            osc.start(now);
            oscillators.push(osc);
        });

        try {
            const bufferSize = audioCtx.sampleRate * 0.03;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.value = 2500;
            noiseFilter.Q.value = 3.0;

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.12, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);

            whiteNoise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            whiteNoise.start(now);
        } catch(e) {}

        activeNotes.set(midiNote, {
            oscillators,
            masterGain,
            stop: () => {
                const ct = audioCtx.currentTime;
                try {
                    masterGain.gain.cancelScheduledValues(ct);
                    masterGain.gain.setValueAtTime(masterGain.gain.value, ct);
                    masterGain.gain.exponentialRampToValueAtTime(0.0001, ct + 0.15);
                    setTimeout(() => {
                        oscillators.forEach(o => { try { o.stop(); } catch(e){} });
                    }, 160);
                } catch(e) {}
            }
        });
    }

    function stopPianoNote(midiNote) {
        if (activeNotes.has(midiNote)) {
            const noteData = activeNotes.get(midiNote);
            noteData.stop();
            activeNotes.delete(midiNote);
        }
    }
 // --- UI・幾何学七角形ピアノパッド設計 ---
    let transposeOffset = 0;
    let selectedChord = null;

    const noteNamesSharp = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const noteNamesFlat  = ["C", "D♭", "D", "E♭", "E", "F", "G♭", "G", "A♭", "A", "B♭", "B"];

    const baseSectors = [
        { name: "C", baseMidi: 60, color: "#ff3333" }, 
        { name: "D", baseMidi: 62, color: "#e6cc00" }, 
        { name: "E", baseMidi: 64, color: "#2eb82e" }, 
        { name: "F", baseMidi: 65, color: "#ffb366" }, 
        { name: "G", baseMidi: 67, color: "#33cccc" }, 
        { name: "A", baseMidi: 69, color: "#3366ff" }, 
        { name: "B", baseMidi: 71, color: "#b333cc" }  
    ];

    const chordIntervals = {
        "Maj": [0, 4, 7],
        "Min": [0, 3, 7],
        "Dim": [0, 3, 6],
        "Aug": [0, 4, 8],
        "Maj7": [0, 4, 7, 11],
        "Min7": [0, 3, 7, 10],
        "7": [0, 4, 7, 10],
        "M7b7": [0, 4, 6, 10],
        "Add7": [0, 4, 7, 10],
        "Add9": [0, 4, 7, 14],
        "Slash": [0, 7], 
        "9": [0, 4, 7, 10, 14],
        "11": [0, 4, 7, 10, 14, 17],
        "13": [0, 4, 7, 10, 14, 21]
    };

    const pianoCanvas = document.getElementById('piano-canvas');
    const pianoCtx = pianoCanvas.getContext('2d');
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');

    function resizeCanvases() {
        const pRect = pianoCanvas.parentElement.getBoundingClientRect();
        if (pRect.width > 0 && pRect.height > 0) {
            pianoCanvas.width = pRect.width * window.devicePixelRatio;
            pianoCanvas.height = pRect.height * window.devicePixelRatio;
        }

        bgCanvas.width = window.innerWidth * window.devicePixelRatio;
        bgCanvas.height = window.innerHeight * window.devicePixelRatio;
    }
    
    window.addEventListener('resize', resizeCanvases);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvases, 200));
    
    // 初回確実にサイズを反映
    setTimeout(resizeCanvases, 50);

    // --- 描画ループ & モーショングラフィックス ---
    function draw() {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        
        activeRipples.forEach((r, index) => {
            r.radius += 4 * window.devicePixelRatio;
            r.alpha -= 0.02;
            if (r.alpha <= 0) {
                activeRipples.splice(index, 1);
                return;
            }
            bgCtx.save();
            bgCtx.beginPath();
            bgCtx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
            bgCtx.strokeStyle = `rgba(0, 255, 255, ${r.alpha})`;
            bgCtx.lineWidth = 3 * window.devicePixelRatio;
            bgCtx.stroke();
            bgCtx.restore();
        });

        pianoCtx.clearRect(0, 0, pianoCanvas.width, pianoCanvas.height);
        
        if (pianoCanvas.width > 0 && pianoCanvas.height > 0) {
            const cx = pianoCanvas.width / 2;
            const cy = pianoCanvas.height / 2;
            const maxRadius = Math.min(cx, cy) * 0.95;
            
            const rings = [
                { rMin: maxRadius * 0.22, rMax: maxRadius * 0.45, octOffset: -1 }, 
                { rMin: maxRadius * 0.47, rMax: maxRadius * 0.70, octOffset: 0 },  
                { rMin: maxRadius * 0.72, rMax: maxRadius * 0.96, octOffset: 1 }   
            ];

            const angleStep = (Math.PI * 2) / 7;
            const startAngleOffset = -Math.PI / 2 - angleStep / 2;

            rings.forEach((ring, ringIdx) => {
                baseSectors.forEach((sector, secIdx) => {
                    const angleStart = startAngleOffset + secIdx * angleStep;
                    const angleEnd = startAngleOffset + (secIdx + 1) * angleStep;
                    
                    const gap = 0.015; 
                    const aStart = angleStart + gap;
                    const aEnd = angleEnd - gap;

                    const isTouched = activeGlows.some(g => g.ringIdx === ringIdx && g.secIdx === secIdx);

                    pianoCtx.save();
                    pianoCtx.beginPath();
                    pianoCtx.arc(cx, cy, ring.rMax, aStart, aEnd, false);
                    pianoCtx.arc(cx, cy, ring.rMin, aEnd, aStart, true);
                    pianoCtx.closePath();

                    if (isTouched) {
                        pianoCtx.fillStyle = '#ffffff';
                        pianoCtx.shadowColor = sector.color;
                        pianoCtx.shadowBlur = 25 * window.devicePixelRatio;
                    } else {
                        pianoCtx.fillStyle = sector.color;
                        pianoCtx.shadowColor = sector.color;
                        pianoCtx.shadowBlur = 8 * window.devicePixelRatio;
                    }
                    pianoCtx.fill();

                    pianoCtx.lineWidth = 3.5 * window.devicePixelRatio;
                    pianoCtx.strokeStyle = '#000000';
                    pianoCtx.stroke();
                    pianoCtx.restore();

                    const midAngle = (aStart + aEnd) / 2;
                    const midRadius = (ring.rMin + ring.rMax) / 2;
                    const textX = cx + Math.cos(midAngle) * midRadius;
                    const textY = cy + Math.sin(midAngle) * midRadius;

                    const baseMidi = sector.baseMidi + (ring.octOffset * 12) + transposeOffset;
                    const noteIndex = ((baseMidi % 12) + 12) % 12;
                    const labelText = (transposeOffset < 0 ? noteNamesFlat : noteNamesSharp)[noteIndex] + (4 + ring.octOffset + Math.floor((sector.baseMidi + transposeOffset)/12) - 5);

                    pianoCtx.save();
                    pianoCtx.font = `bold ${Math.max(10, maxRadius * 0.075)}px sans-serif`;
                    pianoCtx.fillStyle = isTouched ? '#000000' : '#111111';
                    pianoCtx.textAlign = 'center';
                    pianoCtx.textBaseline = 'middle';
                    pianoCtx.fillText(labelText, textX, textY);
                    pianoCtx.restore();
                });
            });
        }

        requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    // --- タッチ・ポインタイベント処理 ---
    const touchMap = new Map();

    pianoCanvas.addEventListener('pointerdown', handlePointerDown);
    pianoCanvas.addEventListener('pointermove', handlePointerMove);
    pianoCanvas.addEventListener('pointerup', handlePointerUp);
    pianoCanvas.addEventListener('pointercancel', handlePointerUp);

    function getTouchSector(x, y) {
        const rect = pianoCanvas.getBoundingClientRect();
        const scaleX = pianoCanvas.width / rect.width;
        const scaleY = pianoCanvas.height / rect.height;
        const px = (x - rect.left) * scaleX;
        const py = (y - rect.top) * scaleY;

        const cx = pianoCanvas.width / 2;
        const cy = pianoCanvas.height / 2;
        const dx = px - cx;
        const dy = py - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        const maxRadius = Math.min(cx, cy) * 0.95;
        const rings = [
            { rMin: maxRadius * 0.22, rMax: maxRadius * 0.45, octOffset: -1 },
            { rMin: maxRadius * 0.47, rMax: maxRadius * 0.70, octOffset: 0 },
            { rMin: maxRadius * 0.72, rMax: maxRadius * 0.96, octOffset: 1 }
        ];

        let ringIdx = -1;
        for (let i = 0; i < rings.length; i++) {
            if (dist >= rings[i].rMin && dist <= rings[i].rMax) {
                ringIdx = i;
                break;
            }
        }
        if (ringIdx === -1) return null;

        let angle = Math.atan2(dy, dx);
        const angleStep = (Math.PI * 2) / 7;
        const startAngleOffset = -Math.PI / 2 - angleStep / 2;
        
        let relAngle = angle - startAngleOffset;
        while (relAngle < 0) relAngle += Math.PI * 2;
        while (relAngle >= Math.PI * 2) relAngle -= Math.PI * 2;

        let secIdx = Math.floor(relAngle / angleStep);
        if (secIdx < 0 || secIdx >= 7) return null;

        return { ringIdx, secIdx };
    }

    function handlePointerDown(e) {
        e.preventDefault();
        initAudio();
        const pos = getTouchSector(e.clientX, e.clientY);
        if (!pos) return;
        triggerPlay(e.pointerId, pos.ringIdx, pos.secIdx);
    }

    function handlePointerMove(e) {
        e.preventDefault();
        const pos = getTouchSector(e.clientX, e.clientY);
        if (touchMap.has(e.pointerId)) {
            const current = touchMap.get(e.pointerId);
            if (!pos || current.ringIdx !== pos.ringIdx || current.secIdx !== pos.secIdx) {
                releaseTouch(e.pointerId);
                if (pos) {
                    triggerPlay(e.pointerId, pos.ringIdx, pos.secIdx);
                }
            }
        }
    }

    function handlePointerUp(e) {
        e.preventDefault();
        releaseTouch(e.pointerId);
    }

    function triggerPlay(pointerId, ringIdx, secIdx) {
        const rings = [{octOffset: -1}, {octOffset: 0}, {octOffset: 1}];
        const sector = baseSectors[secIdx];
        const baseMidi = sector.baseMidi + (rings[ringIdx].octOffset * 12) + transposeOffset;

        let midiNotesToPlay = [baseMidi];
        if (selectedChord && chordIntervals[selectedChord]) {
            midiNotesToPlay = chordIntervals[selectedChord].map(interval => baseMidi + interval);
        }

        midiNotesToPlay.forEach(note => playPianoNote(note));
        touchMap.set(pointerId, { ringIdx, secIdx, midiNotes: midiNotesToPlay });
        activeGlows.push({ pointerId, ringIdx, secIdx });
    }

    function releaseTouch(pointerId) {
        if (touchMap.has(pointerId)) {
            const data = touchMap.get(pointerId);
            data.midiNotes.forEach(note => stopPianoNote(note));
            touchMap.delete(pointerId);
        }
        const idx = activeGlows.findIndex(g => g.pointerId === pointerId);
        if (idx !== -1) {
            activeGlows.splice(idx, 1);
        }
    }

    document.addEventListener('pointerdown', (e) => {
        if (e.target.id !== 'piano-canvas' && !e.target.classList.contains('chord-btn') && !e.target.classList.contains('trans-btn')) {
            activeRipples.push({
                x: e.clientX * window.devicePixelRatio,
                y: e.clientY * window.devicePixelRatio,
                radius: 10,
                alpha: 0.7
            });
        }
    });

    const chordButtons = document.querySelectorAll('.chord-btn');
    chordButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            const chordType = btn.getAttribute('data-chord');
            if (chordType === 'Clear') {
                selectedChord = null;
                chordButtons.forEach(b => b.classList.clear('active'));
                chordButtons.forEach(b => {
                    if (b.dataset.chord.includes('7')) b.className = 'chord-btn type-maj7';
                    else if (b.dataset.chord.includes('Add')) b.className = 'chord-btn type-add';
                    else if (['Slash', 'Clear'].includes(b.dataset.chord)) b.className = 'chord-btn type-gray';
                    else if (['9', '11', '13'].includes(b.dataset.chord)) b.className = 'chord-btn type-ext';
                    else b.className = 'chord-btn';
                });
            } else {
                if (selectedChord === chordType) {
                    selectedChord = null;
                    btn.classList.remove('active');
                } else {
                    chordButtons.forEach(b => b.classList.remove('active'));
                    selectedChord = chordType;
                    btn.classList.add('active');
                }
            }
        });
    });

    const transValueDisplay = document.getElementById('trans-value');
    document.getElementById('btn-flat').addEventListener('click', () => {
        if (transposeOffset > -12) {
            transposeOffset--;
            transValueDisplay.textContent = transposeOffset;
        }
    });
    document.getElementById('btn-sharp').addEventListener('click', () => {
        if (transposeOffset < 12) {
            transposeOffset++;
            transValueDisplay.textContent = (transposeOffset > 0 ? "+" : "") + transposeOffset;
        }
    });
</script>

</body>
</html>
