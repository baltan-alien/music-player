<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111217"><link rel="manifest" href="manifest.json">
<title>Chromatic Electric Piano</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:#101114;color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;touch-action:none;overscroll-behavior:none}
body{display:flex;flex-direction:column}header{height:50px;flex:0 0 50px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:#17181c;border-bottom:1px solid #36383e}
h1{font-size:17px;margin:0}.status{font-size:15px;color:#ffd34f;font-weight:800}
main{flex:1;min-height:0;display:grid;grid-template-columns:39% 61%;overflow:hidden}
#left{min-width:0;background:linear-gradient(#252525,#171717);padding:10px 13px;display:flex;flex-direction:column;overflow:hidden}
#left h2{font-size:25px;margin:0 0 8px}.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:7px}
.ch{border:0;border-radius:10px;color:#fff;font-size:clamp(12px,1.65vw,18px);font-weight:750;touch-action:none}.r{background:#ff7653}.g{background:#6bc36f}.b{background:#3ca6ed}.p{background:#ad4dc2}.y{background:#f4c52c;color:#241d05}.gray{background:#93a5af}
.ch.active{outline:4px solid #fff;filter:brightness(1.25);transform:scale(.97)}
#mode{font-size:13px;color:#ddd;margin:7px 0 5px}#sound{display:flex;gap:15px;font-size:14px;white-space:nowrap}#sound label{display:flex;align-items:center;gap:5px}
input{accent-color:#168cff;width:20px;height:20px}
#right{position:relative;min-width:0;overflow:hidden;background:#090a0d}.legend{position:absolute;right:9px;top:7px;color:#737986;font-size:10px}
#wheel{position:absolute;left:50%;top:50%;width:min(94vh,58vw);height:min(94vh,58vw);transform:translate(-50%,-50%)}
.ring{position:absolute;border:1px solid #20252d;border-radius:50%}.r1{inset:7%}.r2{inset:25%}.r3{inset:43%}
.note{position:absolute;transform:translate(-50%,-50%);width:clamp(46px,5vw,66px);height:clamp(46px,5vw,66px);border:0;border-radius:50%;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1.02;box-shadow:0 5px 8px #0008;touch-action:none;user-select:none}
.note.black{filter:saturate(.55)}.note.active{outline:4px solid #fff;filter:brightness(1.35) saturate(1.2);transform:translate(-50%,-50%) scale(1.1);z-index:20}.note.chordlit{box-shadow:0 0 0 3px #fff6,0 6px 12px #000a}
.jp{font-size:clamp(10px,1.2vw,15px)}.en{font-size:clamp(9px,1vw,13px)}
.staff{position:relative;width:30px;height:17px;margin-top:2px}.staff i{position:absolute;left:0;right:0;height:1px;background:#fff}.staff i:nth-child(1){top:1px}.staff i:nth-child(2){top:5px}.staff i:nth-child(3){top:9px}.staff i:nth-child(4){top:13px}.staff i:nth-child(5){top:17px}.head{position:absolute;width:6px;height:4px;border-radius:50%;background:#fff;left:13px;top:6px;transform:rotate(-20deg)}
@media(max-width:700px) and (orientation:portrait){main{grid-template-columns:1fr;grid-template-rows:43% 57%}#wheel{width:min(92vw,50vh);height:min(92vw,50vh)}#left{padding:7px}#left h2{font-size:20px}.ch{font-size:13px}}
@media(max-height:440px) and (orientation:landscape){header{height:42px;flex-basis:42px}#left{padding:6px 9px}#left h2{font-size:20px;margin-bottom:4px}.grid{gap:5px}.ch{font-size:13px}#mode{margin:4px 0;font-size:11px}#sound{font-size:12px}}
</style></head><body>
<header><h1>Chromatic Electric Piano</h1><div class="status" id="status">ルート：C</div></header>
<main><section id="left"><h2>コード</h2><div class="grid" id="chords"></div><div id="mode">コードモード：なし</div>
<div id="sound"><label><input type="radio" name="v" value="ep" checked>電子ピアノ</label><label><input type="radio" name="v" value="8">ピコピコ</label></div></section>
<section id="right"><div class="legend">3 OCT / 4 OCT / 5 OCT</div><div id="wheel"></div></section></main>
<script>
const N=[["C","ド",0],["C#","ド♯",1],["D","レ",2],["D#","レ♯",3],["E","ミ",4],["F","ファ",5],["F#","ファ♯",6],["G","ソ",7],["G#","ソ♯",8],["A","ラ",9],["A#","ラ♯",10],["B","シ",11]];
const C=[["Maj",[0,4,7],"r"],["Min",[0,3,7],"r"],["Dim",[0,3,6],"r"],["Aug",[0,4,8],"r"],["7",[0,4,7,10],"g"],["Maj7",[0,4,7,11],"g"],["m7",[0,3,7,10],"g"],["m7b5",[0,3,6,10],"g"],["Add9",[0,4,7,14],"b"],["Add11",[0,4,7,17],"b"],["9",[0,4,7,10,14],"p"],["11",[0,4,7,10,14,17],"p"],["13",[0,4,7,10,14,17,21],"p"],["Slash",[0,4,7],"y"],["Clear",null,"gray"]];
let chord=null,root=0,ctx=null,master=null,voices=new Map(),vtype="ep";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
C.forEach(([name,ints,cl])=>{let b=document.createElement("button");b.className="ch "+cl;b.textContent=name;if(name==="Clear"){b.onclick=()=>{chord=null;sync()}}else{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);chord={ints,b,name};b.classList.add("active");sync()};let u=e=>{e.preventDefault();if(chord?.b===b)chord=null;b.classList.remove("active");sync()};b.onpointerup=u;b.onpointercancel=u}$("#chords").appendChild(b)});
function sync(){$("#mode").textContent="コードモード："+(chord?chord.name:"なし");$$(".note").forEach(n=>n.classList.remove("chordlit"));if(chord)chord.ints.forEach(i=>$$('.note[data-pc="'+((root+i)%12)+'"]').forEach(n=>n.classList.add("chordlit")))}
function wake(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});master=ctx.createGain();master.gain.value=.55;master.connect(ctx.destination)}return ctx.state==="suspended"?ctx.resume():Promise.resolve()}
function f(m){return 440*Math.pow(2,(m-69)/12)}
function start(id,m){if(voices.has(id))return;let t=ctx.currentTime,g=ctx.createGain(),o=ctx.createOscillator(),o2=ctx.createOscillator();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.3,t+.006);g.gain.linearRampToValueAtTime(.12,t+1);g.gain.exponentialRampToValueAtTime(.045,t+3.8);if(vtype==="8"){o.type=o2.type="square";o.frequency.value=f(m);o2.frequency.value=f(m)*2}else{o.type="triangle";o2.type="sine";o.frequency.value=f(m);o2.frequency.value=f(m)*2}o.connect(g);o2.connect(g);g.connect(master);o.start(t);o2.start(t);voices.set(id,{g,o,o2})}
function stop(id){let v=voices.get(id);if(!v)return;let t=ctx.currentTime;v.g.gain.cancelScheduledValues(t);v.g.gain.setTargetAtTime(.0001,t,.025);v.o.stop(t+.12);v.o2.stop(t+.12);voices.delete(id)}
[3,4,5].forEach((oct,ri)=>N.forEach((n,pc)=>{let b=document.createElement("button");b.className="note"+(n[2]?" black":"");b.dataset.pc=pc;b.style.background=["#4b3a78","#3c6d6c","#e84c58","#6d3f68","#5c7944","#3b85cc","#37a3a3","#4f79bd","#a94e9f","#e2df43","#58a1e9","#e36b4d"][pc];let r=[43,25,7][ri],a=(pc*30-90)*Math.PI/180;b.style.left=(50+r*Math.cos(a))+"%";b.style.top=(50+r*Math.sin(a))+"%";b.innerHTML='<span class="jp">'+n[1]+'</span><span class="en">'+n[0]+'</span><span class="staff"><i></i><i></i><i></i><i></i><i></i><b class="head"></b></span>';b.onpointerdown=async e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);await wake();if(oct===5){root=pc;$("#status").textContent="ルート："+n[0];sync()}let base=oct*12+pc,ids=[];if(chord)chord.ints.forEach((iv,k)=>{let id="c"+pc+"-"+oct+"-"+k;start(id,base+iv+12);ids.push(id)});else{let id="n"+pc+"-"+oct;start(id,base+12);ids.push(id)}b.dataset.ids=ids.join(",");b.classList.add("active")};let u=e=>{e.preventDefault();(b.dataset.ids||"").split(",").filter(Boolean).forEach(stop);b.dataset.ids="";b.classList.remove("active")};b.onpointerup=u;b.onpointercancel=u;$("#wheel").appendChild(b)}));
$$('input[name="v"]').forEach(x=>x.onchange=()=>vtype=x.value);
</script></body></html>
