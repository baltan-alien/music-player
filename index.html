<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10131a">
<link rel="manifest" href="manifest.json">
<title>Chromatic Electric Piano</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1016;color:#eee;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
body{touch-action:none}#app{height:100%;display:flex;flex-direction:column}
header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#151923;border-bottom:1px solid #2b3140}
#title{font-weight:700;font-size:15px}#rootDisplay{font-size:14px;color:#ffd36b;font-weight:700}
main{flex:1;display:flex;min-height:0}
#chords{width:38%;max-width:280px;overflow:auto;padding:8px;background:#11151e;border-right:1px solid #2b3140}
.group{margin-bottom:10px}.group h2{font-size:11px;color:#9da6b8;margin:3px 4px 6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
button{border:1px solid #3a4151;background:#1c222e;color:#f2f4f7;border-radius:8px;min-height:42px;font-size:13px;font-weight:650}
button:active{transform:scale(.97);background:#343c4d}.chord.selected{border-color:#ffd36b;color:#ffd36b}
#piano{flex:1;position:relative;min-width:0;background:#0b0e14}#circle{position:absolute;inset:4px}
.note{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;border:2px solid #4a5160;box-shadow:0 3px 8px #0008;user-select:none}
.note.white{background:#e9edf3;color:#111;border-color:#fff}.note.black{background:#626977;color:#f3f4f6;border-color:#828997}
.note.root{border-color:#ffd36b;box-shadow:0 0 0 3px #ffd36b55,0 3px 10px #000}
.note.chord{background:#8d6c2f;color:#fff;border-color:#ffd36b}.note.root.chord{background:#b08327}
.note .jp{font-size:13px;font-weight:800}.note .en{font-size:11px;font-weight:700}
.ringLabel{position:absolute;transform:translate(-50%,-50%);font-size:9px;color:#596172;pointer-events:none}
#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#697184;font-size:11px;pointer-events:none}
footer{height:36px;background:#151923;border-top:1px solid #2b3140;display:flex;align-items:center;justify-content:center;color:#8790a2;font-size:10px}
@media(min-width:700px){#chords{max-width:330px}.note .jp{font-size:16px}.note .en{font-size:12px}}
</style>
</head>
<body>
<div id="app">
<header><div id="title">Chromatic Electric Piano</div><div id="rootDisplay">ルート：C</div></header>
<main><section id="chords"></section><section id="piano"><div id="circle"></div><div id="hint">外周の音名をタップ<br>ルートを選択できます</div></section></main>
<footer>音名をタップ＝演奏・ルート選択　／　コードをタップ＝コード演奏</footer>
</div>
<script>
const NOTES=[["C","ド",0],["C♯","ド♯",1],["D","レ",2],["D♯","レ♯",3],["E","ミ",4],["F","ファ",5],["F♯","ファ♯",6],["G","ソ",7],["G♯","ソ♯",8],["A","ラ",9],["A♯","ラ♯",10],["B","シ",11]];
const WHITE=new Set([0,2,4,5,7,9,11]);
const groups=[["3和音",[["M","M"],["m","m"],["dim","dim"],["aug","aug"]]],["4和音",[["7","7"],["maj7","maj7"],["m7","m7"],["m7♭5","m7b5"]]],["Add系",[["add9","add9"],["add11","add11"]]],["テンション",[["9","9"],["11","11"],["13","13"]]],["分数",[["/E","slashE"],["/G","slashG"],["/B","slashB"]]]];
const chordIntervals={M:[0,4,7],m:[0,3,7],dim:[0,3,6],aug:[0,4,8],"7":[0,4,7,10],maj7:[0,4,7,11],m7:[0,3,7,10],m7b5:[0,3,6,10],add9:[0,4,7,14],add11:[0,4,7,17],9:[0,4,7,10,14],11:[0,4,7,10,14,17],13:[0,4,7,10,14,21]};
let root=0,activeChord=null,audioCtx=null;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}
function midiFreq(m){return 440*Math.pow(2,(m-69)/12)}
function epNote(midi,when=0,dur=.95,velocity=.8){
 ensureAudio();const t=audioCtx.currentTime+when,f=midiFreq(midi);
 const out=audioCtx.createGain(),filter=audioCtx.createBiquadFilter(),o1=audioCtx.createOscillator(),o2=audioCtx.createOscillator(),g2=audioCtx.createGain();
 out.gain.setValueAtTime(.0001,t);out.gain.exponentialRampToValueAtTime(.42*velocity,t+.008);out.gain.exponentialRampToValueAtTime(.16*velocity,t+.12);out.gain.exponentialRampToValueAtTime(.0001,t+dur);
 filter.type="lowpass";filter.frequency.setValueAtTime(4200,t);o1.type="triangle";o1.frequency.value=f;o2.type="sine";o2.frequency.value=f*2;g2.gain.value=.22;
 o1.connect(filter);o2.connect(g2);g2.connect(filter);filter.connect(out);out.connect(audioCtx.destination);o1.start(t);o2.start(t);o1.stop(t+dur+.05);o2.stop(t+dur+.05);
}
function playNote(i,ring){epNote(({2:36,3:48,4:60}[ring]??60)+i,0,.95,.85)}
function playChord(sym){
 const rm=60+root;
 if(sym.startsWith("slash")){const bass={slashE:4,slashG:7,slashB:11}[sym];epNote(48+bass,0,.9,.9);[0,4,7].forEach((x,i)=>epNote(rm+x,.035+i*.015,1.05,.62));return}
 (chordIntervals[sym]||[0]).forEach((x,i)=>epNote(rm+x,i*.018,1.15,.68));
}
function chordName(sym){const n=NOTES[root][0];return sym==="slashE"?n+"/E":sym==="slashG"?n+"/G":sym==="slashB"?n+"/B":n+sym}
function buildChordUI(){
 const el=document.getElementById("chords");el.innerHTML="";
 groups.forEach(([name,items])=>{const g=document.createElement("div");g.className="group";g.innerHTML="<h2>"+name+"</h2>";const grid=document.createElement("div");grid.className="grid";
 items.forEach(([label,sym])=>{const b=document.createElement("button");b.className="chord"+(activeChord===sym?" selected":"");b.textContent=label;b.onclick=()=>{activeChord=sym;playChord(sym);renderNotes();buildChordUI()};grid.appendChild(b)});g.appendChild(grid);el.appendChild(g)});
}
function renderNotes(){
 const area=document.getElementById("circle");area.innerHTML="";const w=area.clientWidth,h=area.clientHeight,cx=w/2,cy=h/2,maxR=Math.min(w,h)*.44;
 const radii={2:maxR*.38,3:maxR*.67,4:maxR},sizes={2:maxR*.24,3:maxR*.19,4:maxR*.15};
 document.getElementById("rootDisplay").textContent="ルート："+NOTES[root][0];
 Object.entries(radii).forEach(([oct,r])=>{const lab=document.createElement("div");lab.className="ringLabel";lab.style.left=cx+"px";lab.style.top=(cy-r*.52)+"px";lab.textContent=oct+"oct";area.appendChild(lab);
  for(let i=0;i<12;i++){const a=-Math.PI/2+i*Math.PI*2/12,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r,n=document.createElement("div");n.className="note "+(WHITE.has(i)?"white":"black");
   if(i===root)n.classList.add("root");let tone=false;if(activeChord&&chordIntervals[activeChord])tone=chordIntervals[activeChord].some(v=>v%12===((i-root+12)%12));if(tone)n.classList.add("chord");
   n.style.left=x+"px";n.style.top=y+"px";n.style.width=sizes[oct]+"px";n.style.height=sizes[oct]+"px";n.innerHTML='<span class="jp">'+NOTES[i][1]+'</span><span class="en">'+NOTES[i][0]+'</span>';
   n.addEventListener("click",()=>{if(String(oct)==="4"){root=i;activeChord=null;buildChordUI();renderNotes()}playNote(i,Number(oct))});area.appendChild(n)}
 });
}
window.addEventListener("resize",renderNotes);buildChordUI();requestAnimationFrame(renderNotes);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
