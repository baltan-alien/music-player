<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<title>Neon Piano</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section class="chords" id="chords">
    <button class="maj" data-chord="maj">Maj</button><button class="maj" data-chord="min">Min</button><button class="maj" data-chord="dim">Dim</button><button class="maj" data-chord="aug">Aug</button>
    <button class="seventh" data-chord="maj7">Maj7</button><button class="seventh" data-chord="min7">Min7</button><button class="seventh" data-chord="7">7</button><button class="seventh" data-chord="7">M7♭7</button>
    <button class="add" data-chord="add7">Add7</button><button class="add" data-chord="add9">Add9</button><button class="utility" data-action="slash">Slash</button><button class="utility" data-action="clear">Clear</button>
    <button class="tension" data-tension="9">9</button><button class="tension" data-tension="11">11</button><button class="tension" data-tension="13">13</button>
  </section>
  <section class="transpose">
    <button id="flat" aria-label="半音下げる">♭</button>
    <output id="offset">0</output>
    <button id="sharp" aria-label="半音上げる">♯</button>
  </section>
  <section class="wheel-wrap">
    <svg id="wheel" viewBox="0 0 500 560" role="group" aria-label="音階ボタン"></svg>
  </section>
  <div id="status" aria-live="polite">C major</div>
</main>
<script src="app.js"></script>
</body>
</html>
